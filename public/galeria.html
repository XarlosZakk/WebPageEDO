        <i class="fa-solid fa-arrow-left"></i> Volver al Inicio

    <!-- HERO BANNER -->
    <section class="gallery-hero" id="gallery-hero">

        <img src="./img/comboi_1.png" alt="Convoy EDO" />

      <div class="hero-overlay"></div>
      <div class="hero-content">

          Nuestra Galería
        </h1>
        <p>Revive los mejores momentos de nuestros convoyes y eventos</p>
        <div class="hero-stats">
          <div class="stat">
            <span class="stat-number" id="total-photos">0</span>
            <span class="stat-label">Fotos</span>
          </div>
          <div class="stat">
            <span class="stat-number">3</span>
            <span class="stat-label">Categorías</span>
          </div>
          <div class="stat">
            <span class="stat-number">∞</span>
            <span class="stat-label">Recuerdos</span>
          </div>
        </div>
      </div>
      <div class="scroll-indicator">
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </section>

    <!-- FILTER BAR -->
    <section class="filter-section" id="filter-section">
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">
          <i class="fa-solid fa-border-all"></i> Todas
        </button>
        <button class="filter-btn" data-filter="convoy">
          <i class="fa-solid fa-truck-moving"></i> Convoyes
        </button>
        <button class="filter-btn" data-filter="event">
          <i class="fa-solid fa-calendar-star"></i> Eventos
        </button>
        <button class="filter-btn" data-filter="community">
          <i class="fa-solid fa-users"></i> Comunidad
        </button>
      </div>
    </section>

    <!-- GALLERY GRID -->
    <main class="gallery-main">
      <div class="gallery-grid" id="gallery-grid">
        <!-- Images will be injected by JS -->
      </div>
    </main>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop"></div>
      <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      <div class="lightbox-content">
        <img id="lightbox-img" src="" alt="" />
        <div class="lightbox-info">
          <h3 id="lightbox-title"></h3>
          <p id="lightbox-desc"></p>
          <span class="lightbox-counter" id="lightbox-counter"></span>
        </div>
      </div>
    </div>

        {

          title: 'Orgullo EDO',
          desc: 'El orgullo de pertenecer a la mejor comunidad de transporte.',
          category: 'community',

        },
        {
          src: './img/Comunidad/comunidad_11.jpg',
          title: 'Nuevos Horizontes',
          desc: 'Explorando nuevas rutas y destinos como comunidad.',
          category: 'community',
          size: 'medium'
        },
        {
          src: './img/Comunidad/Comunidad_12.png',
          title: 'Recuerdos Inolvidables',
          desc: 'Cada foto cuenta una historia de nuestra gran comunidad.',
          category: 'community',
          size: 'large'
        },
        {
          src: './img/Comunidad/Comunidad_20.png',
          title: 'Legado Comunitario',
          desc: 'Construyendo un legado que perdurará en el tiempo.',
          category: 'community',
          size: 'large'
        }
      ];

      // ========================
      // GALLERY RENDERING
      // ========================
      const grid = document.getElementById('gallery-grid');
      const totalPhotos = document.getElementById('total-photos');
      let currentFilter = 'all';
      let filteredData = [...galleryData];

      function renderGallery(filter) {
        currentFilter = filter;
        filteredData = filter === 'all'
          ? [...galleryData]
          : galleryData.filter(img => img.category === filter);

        grid.innerHTML = '';
        totalPhotos.textContent = filteredData.length;

        filteredData.forEach((img, idx) => {
          const item = document.createElement('div');
          item.className = `gallery-item gallery-item--${img.size}`;
          item.dataset.index = idx;
          item.style.animationDelay = `${idx * 0.07}s`;

          item.innerHTML = `
            <div class="gallery-item__inner">
              <img src="${img.src}" alt="${img.title}" loading="lazy" decoding="async" />
              <div class="gallery-item__overlay">
                <div class="gallery-item__info">
                  <span class="gallery-item__category">${img.category}</span>
                  <h3 class="gallery-item__title">${img.title}</h3>
                  <p class="gallery-item__desc">${img.desc}</p>
                  <span class="gallery-item__view">
                    <i class="fa-solid fa-expand"></i> Ver imagen
                  </span>
                </div>
              </div>
            </div>
          `;

          item.addEventListener('click', () => openLightbox(idx));
          grid.appendChild(item);
        });

        // Trigger stagger animation
        requestAnimationFrame(() => {
          grid.querySelectorAll('.gallery-item').forEach(el => {
            el.classList.add('gallery-item--visible');
          });
        });
      }

      // ========================
      // FILTER BUTTONS
      // ========================
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderGallery(btn.dataset.filter);
        });
      });

      // ========================
      // LIGHTBOX
      // ========================
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxTitle = document.getElementById('lightbox-title');
      const lightboxDesc = document.getElementById('lightbox-desc');
      const lightboxCounter = document.getElementById('lightbox-counter');
      let currentIndex = 0;

      function openLightbox(index) {
        currentIndex = index;
        updateLightbox();
        lightbox.classList.add('active');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      function updateLightbox() {
        const img = filteredData[currentIndex];
        lightboxImg.src = img.src;
        lightboxImg.alt = img.title;
        lightboxTitle.textContent = img.title;
        lightboxDesc.textContent = img.desc;
        lightboxCounter.textContent = `${currentIndex + 1} / ${filteredData.length}`;

        // Reset animation
        lightboxImg.style.animation = 'none';
        lightboxImg.offsetHeight;
        lightboxImg.style.animation = '';
      }

      function nextImage() {
        currentIndex = (currentIndex + 1) % filteredData.length;
        updateLightbox();
      }

      function prevImage() {
        currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
        updateLightbox();
      }

      document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
      document.getElementById('lightbox-next').addEventListener('click', nextImage);
      document.getElementById('lightbox-prev').addEventListener('click', prevImage);
      document.querySelector('.lightbox-backdrop').addEventListener('click', closeLightbox);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
      });

      // Touch swipe support
      let touchStartX = 0;
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) {
          diff > 0 ? prevImage() : nextImage();
        }
      }, { passive: true });

      // ========================
      // SCROLL ANIMATIONS
      // ========================
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.filter-section, .gallery-main, footer').forEach(el => {
        observer.observe(el);
      });

      // Parallax hero on scroll
      window.addEventListener('scroll', () => {
        const hero = document.getElementById('gallery-hero');
        const scrolled = window.pageYOffset;
        if (hero) {
          const bg = hero.querySelector('.hero-bg img');
          if (bg) bg.style.transform = `scale(1.1) translateY(${scrolled * 0.3}px)`;
        }
      }, { passive: true });

      // ========================
      // INIT
      // ========================
      renderGallery('all');
